# Home dashboard (YAML mode). Top: Shellys that are reachable. Bottom: the ones that are not.
# A device counts as reachable when its relay reads on/off (anything else, e.g. unavailable, means unreachable).
# The cards move by themselves as devices come and go. Grouped by device until rooms (areas) exist.
title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Connected
            heading_style: title
            icon: mdi:wifi
          - type: conditional
