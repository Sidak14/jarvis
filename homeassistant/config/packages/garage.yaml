# Garage door: the tilt sensor says where the door is; the Athom opener has one button.
#
# - State (sensor.garage_door_status):  open | closed   (from the Third Reality tilt sensor: on = open, off = closed)
#                                       opening | closing   for 15 seconds after you press Open / Close here
#                                       unavailable   if the tilt sensor is
# - You can Open (when it is closed) and Close (when it is open). There is no Stop.
# - After a press the door needs about 15 seconds, and pressing again is ignored until that is over. Then the state
#   goes back to whatever the sensor says.
# - If the sensor changes without a press here, someone used the remote or the wall button: the state just follows it.
#
# The opener has ONE signal (it tells the motor "go"), so Open and Close both send the same thing: script.garage_press.
# (It calls the opener's cover.stop_cover, because the opener's own "open" is ignored while it believes the door is open.)

input_select:
  garage_motion:
    name: Garage door motion
    icon: mdi:garage
    initial: idle
    options:
      - idle
      - opening
      - closing

template:
  - sensor:
      - name: Garage door status
        unique_id: garage_door_status
        icon: >
          {% set s = states('sensor.garage_door_status') %}
          {{ {'open': 'mdi:garage-open', 'closed': 'mdi:garage', 'opening': 'mdi:arrow-up-box', 'closing': 'mdi:arrow-down-box'}.get(s, 'mdi:garage-alert') }}
        state: >
          {% set tilt = states('binary_sensor.third_reality_inc_3rdts01056z') %}
          {% set motion = states('input_select.garage_motion') %}
          {% if tilt in ['unavailable', 'unknown'] %}unavailable
          {% elif motion != 'idle' %}{{ motion }}
          {% elif tilt == 'on' %}open
          {% else %}closed{% endif %}

  - cover:
      - name: Garage door
        unique_id: garage_door_tilt
        device_class: garage
        availability: "{{ states('binary_sensor.third_reality_inc_3rdts01056z') not in ['unavailable', 'unknown'] }}"
        state: >
          {% set motion = states('input_select.garage_motion') %}
          {% if motion != 'idle' %}{{ motion }}
          {% elif is_state('binary_sensor.third_reality_inc_3rdts01056z', 'on') %}open
          {% else %}closed{% endif %}
        open_cover:
          # Only when the door is closed and no press is still in progress.
          - condition: state
            entity_id: sensor.garage_door_status
            state: closed
          - action: script.garage_press
            data: { direction: opening }
        close_cover:
          - condition: state
            entity_id: sensor.garage_door_status
            state: open
          - action: script.garage_press
            data: { direction: closing }

script:
  # THE one signal to the opener, then 15 seconds during which nothing else can be pressed (mode: single).
  garage_press:
    alias: Garage door press
    icon: mdi:gesture-tap-button
    mode: single
    fields:
      direction:
        description: opening or closing (what the door is about to do)
    sequence:
      - action: input_select.select_option
        target: { entity_id: input_select.garage_motion }
        data: { option: "{{ direction }}" }
      - action: cover.stop_cover
        target: { entity_id: cover.athom_garage_door_f99f26_garage_door }
      - delay: { seconds: 15 }
      - action: input_select.select_option
        target: { entity_id: input_select.garage_motion }
        data: { option: idle }
