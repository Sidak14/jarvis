                  name: 'Side Garage energy'
                - entity: binary_sensor.shellyswitch25_c45bbe6bd1ee_channel_1_input
                  name: 'Side Garage input'
                - entity: switch.shellyswitch25_c45bbe6bd1ee_channel_2
                  name: 'Garage'
                - entity: sensor.shellyswitch25_c45bbe6bd1ee_channel_2_power
                  name: 'Garage power'
