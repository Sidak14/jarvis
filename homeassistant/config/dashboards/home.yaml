# Home dashboard (YAML mode). Top: devices that are reachable. Bottom: the ones that are not.
# Reachability comes from binary_sensor.shelly_<ip>_reachable and binary_sensor.meross_<ip>_reachable (packages/shelly_status.yaml).
# switch.shellyswitch25_c8c9a37a653a_channel_2 (Frontyard Top Lights) trips the main circuit if turned on: its entity is disabled and shown read-only here.
title: Home
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Connected
      heading_style: title
      icon: mdi:wifi
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.shelly_155_reachable
        state: 'on'
      card:
        type: entities
        title: Chandelier + Chandelier Down Lights · 155
        show_header_toggle: false
        entities:
        - entity: switch.shellyswitch25_c8c9a375a239_channel_1
          name: Chandelier
        - entity: sensor.shellyswitch25_c8c9a375a239_channel_1_power
          name: Chandelier power
