# Used with: cloudflared --config ~/jarvis/cloudflared/config.yml tunnel run
#
# If you use a locally-managed tunnel (created with `cloudflared tunnel create`),
# uncomment and fill these in:
# tunnel: <TUNNEL-UUID>
# credentials-file: /Users/mahendra/jarvis/cloudflared/<TUNNEL-UUID>.json
#
# NOTE: if you run with a dashboard token (`tunnel run --token ...`), the tunnel
# is remotely managed and the ingress below is IGNORED; set the same public
# hostname -> http://127.0.0.1:8080 in the Cloudflare Zero Trust dashboard.

ingress:
  - hostname: jarvis.gurveerkhalsa.com
    service: http://127.0.0.1:8080
  - service: http_status:404
